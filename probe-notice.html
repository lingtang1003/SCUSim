<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="app"></div>
<script type="module">
  import { createApp } from './src/ui/ui.js';
  const files = ['balance', 'colleges', 'tags', 'actions', 'events', 'endings', 'locations', 'courses'];
  const cfg = {};
  for (const f of files) { try { cfg[f] = await (await fetch('./config/' + f + '.json')).json(); } catch (e) {} }
  document.documentElement.classList.add('reduce-motion');
  const state = { turn: 20, actionPoints: 4,
    player: { name: '林夕', gender: '女', collegeId: 'cs', appearance: 'f_long', location: null,
      attributes: { knowledge: 12, social: 8, health: 9, money: 50 }, tags: ['study_hard'] },
    academics: { semesterScores: [], semesterRecords: [], totalGpa: 3.2, failedCourses: 0, studyActions: 0 },
    pendingEvent: null, eventHistory: [], log: [], endingId: null };
  const availability = {};
  for (const a of cfg.actions.list) availability[a.id] = { ok: true };
  const app = createApp({ config: cfg, callbacks: {}, doc: document, appearance: 'f_long' });
  app.mount(document.getElementById('app'), { hasSave: true });
  app.render(state, { availability });
  document.querySelector('.vn-dialogue')?.click();
  if (typeof app.showNotice === 'function') {
    app.showNotice({ icon: '💰', title: '生活费到账 +80', text: '第 20 周 · 每 4 周发放一次 · 当前金钱 50', tone: 'success' });
  }
  const n = document.querySelector('.vn-notice');
  const cs = n ? getComputedStyle(n, '::before') : null;
  document.title = 'notice=' + (n ? 'yes' : 'no') + ' before=' + (cs ? cs.content : '-');
</script></body></html>
