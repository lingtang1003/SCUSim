<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="app"></div>
<script type="module">
  import { createApp } from './src/ui/ui.js';
  const files = ['balance', 'colleges', 'tags', 'actions', 'events', 'endings', 'locations'];
  const cfg = {};
  for (const f of files) { try { cfg[f] = await (await fetch('./config/' + f + '.json')).json(); } catch (e) {} }
  document.documentElement.classList.add('reduce-motion');
  const state = { turn: 1, actionPoints: 4,
    player: { name: '林夕', gender: '女', collegeId: 'cs', appearance: 'f_long', location: 'college',
      attributes: { knowledge: 5, social: 5, health: 5, money: 5 }, tags: ['study_hard'] },
    academics: { semesterScores: [], semesterRecords: [], totalGpa: 0, failedCourses: 0, studyActions: 0 },
    pendingEvent: null, eventHistory: [], log: [], endingId: null };
  const availability = {};
  for (const a of cfg.actions.list) availability[a.id] = { ok: true };
  const app = createApp({ config: cfg, callbacks: {}, doc: document, appearance: 'f_long' });
  app.mount(document.getElementById('app'), { hasSave: true });
  app.render(state, { availability });
  const btn = Array.from(document.querySelectorAll('button')).find((b) => (b.textContent || '').includes('☰'));
  if (btn) btn.click();
  document.title = 'ready';
</script></body></html>
