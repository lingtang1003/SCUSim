<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b9dcff" />
  <meta name="description" content="SCUSim · 川大校园生活模拟器：视觉小说式的校园养成，40 个星期，从入学到毕业。" />
  <title>SCUSim · 川大校园生活模拟器</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* 首屏底色，避免脚本加载前白闪（与 style.css 的天空渐变一致） */
    html, body { background: linear-gradient(180deg, #e8f4ff, #b9dcff 60%, #ffe6b0); }
    #app { min-height: 100vh; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      color: #3c5c8c; letter-spacing: .2em; font-size: 14px;
    }
    #boot small { letter-spacing: .08em; color: #7d90ab; }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot">
      <div>川大校园生活模拟器</div>
      <small>正在准备校园…</small>
    </div>
  </div>
  <!-- 协调层入口：src/main.js 负责装配 engine + storage + ui -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
