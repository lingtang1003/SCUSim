<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf7f6" />
  <meta name="description" content="SCUSim · 我的大学四年，果然有or没问题！：视觉小说式的校园养成，40 个星期，从入学到毕业。" />
  <title>SCUSim · 我的大学四年，果然有or没问题！</title>
  <!-- 预加载两支正文字体：和 CSS 并行下载，避免先显示系统字体再切换 -->
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/display-hy.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/ui-tangmei.woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* 首屏底色（JS 起来之前的 1 帧）：红白主题，避免蓝金闪一下 */
    html, body { background: #faf7f6; }
    #app { min-height: 100vh; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 30px;
      background: #faf7f6;
      color: #1a1414; letter-spacing: .08em; font-size: 32px;
    }
    #boot .boot__mark {
      width: 132px; height: 132px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #b3121a; color: #fff;
      font-family: "DisplayHY", Georgia, "Songti SC", serif; font-size: 26px; letter-spacing: .01em;
      box-shadow: 0 18px 44px rgba(179, 18, 26, .32);
    }
    #boot .boot__title {
      font-family: 'TitleWood', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      font-size: clamp(34px, 4.6vw, 56px); line-height: 1.18; text-align: center;
      letter-spacing: .02em; font-weight: 400;
    }
    #boot small { letter-spacing: .16em; color: #948a87; font-size: 20px; }
    #boot .boot__bar {
      width: 260px; height: 4px; border-radius: 4px;
      background: linear-gradient(90deg, #b3121a, rgba(179, 18, 26, .15));
      animation: boot-slide 1.2s ease-in-out infinite;
      transform-origin: left center;
    }
    @keyframes boot-slide {
      0%, 100% { transform: scaleX(.35); opacity: .7; }
      50% { transform: scaleX(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .boot__bar { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot">
      <div class="boot__mark">SCUSim</div>
      <div class="boot__title">我的大学四年，果然有or没问题！</div>
      <div class="boot__bar"></div>
      <small>正在进入校园…</small>
    </div>
  </div>
  <!-- 协调层入口：src/main.js 负责装配 engine + storage + ui -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
